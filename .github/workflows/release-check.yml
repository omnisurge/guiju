# 发版产物检查 —— workflow_dispatch 或 v* tag 推送时运行。
#
# 注意：这个 workflow 不替代本地权威发布门。
# - 普通 PR/push 只跑 .github/workflows/ci.yml 的 check-release.py --docs-only；
#   --artifacts 需要 dist/SHA256SUMS 与 tag，不能放进默认 PR 门。
# - 本地 Lead 冻结后的权威发布流程：在干净目录构建 wheel/sdist → 生成 dist/SHA256SUMS →
#   把 SHA-256 写进 docs/ACCEPTANCE.md → 打 tag → python3 scripts/check-release.py --artifacts。
# - 本 workflow 在 CI 重新构建产物，字节不保证与本地冻结产物一致，因此用
#   --skip-acceptance-hashes；tag 校验仅在 tag 触发时执行。
name: release-check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-artifacts:
    name: 构建与发版产物校验
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 运行时依赖必须为零
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          m = re.search(r'^dependencies = \[(.*?)\]', text, re.S | re.M)
          assert m, 'pyproject 缺少 dependencies 段'
          assert not m.group(1).strip(), '运行时依赖必须为空'
          print('运行时依赖：空 ✓')
          PY

      - name: 构建 wheel/sdist
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          sha256sum guiju-*.whl guiju-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 发版产物与 tag 校验
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/check-release.py --artifacts --skip-acceptance-hashes
          else
            python scripts/check-release.py --artifacts --skip-acceptance-hashes --skip-tag
          fi

      - name: wheel 安装烟测
        run: |
          python -m venv /tmp/guiju-release-venv
          /tmp/guiju-release-venv/bin/python -m pip install --no-index --find-links dist guiju
          /tmp/guiju-release-venv/bin/guiju version --json
          /tmp/guiju-release-venv/bin/gj version --json
