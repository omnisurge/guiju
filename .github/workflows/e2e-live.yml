# 联网端到端验收 —— 只能手动触发。
#
# 为什么不随 push 跑：本任务真实请求住建部站点（含一次 4MB 正文下载）。
# 把政府站点当每次提交的压测对象既不合规也不必要；它服务于「发版前 / 改了解析器之后」的验收。
#
# 时效服务（spec-currency）在 NAS 的 Tailscale 私网里，托管 runner 通常够不着：
#   · 配了仓库变量 GUIJU_CURRENCY_URL → 走全量断言
#   · 没配 → 自动跳过编号定位类断言（汇总里写明 SKIP），只验本地路径与抓取能力
#   · 想把「没配」变成失败 → 勾选 require_currency
name: e2e-live

on:
  workflow_dispatch:
    inputs:
      keep_home:
        description: 保留数据目录供排查（默认不留）
        type: boolean
        default: false
      require_currency:
        description: 时效服务不可用时直接失败（默认跳过相关断言）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUIJU_CURRENCY_URL: ${{ vars.GUIJU_CURRENCY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 运行时依赖必须为零
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          m = re.search(r'^dependencies = \[(.*?)\]', text, re.S | re.M)
          assert m, 'pyproject 缺少 dependencies 段'
          assert not m.group(1).strip(), '运行时依赖必须为空'
          print('运行时依赖：空 ✓')
          PY

      - name: 站点可达性预检（区分"环境不合格"与"产品回归"）
        run: |
          python - <<'PY'
          import socket
          import sys

          host = "www.mohurd.gov.cn"
          try:
              print("DNS 解析:", socket.gethostbyname(host))
          except OSError as exc:
              print(f"::error::托管 runner 无法解析 {host}（{exc}）—— 这是跨境 DNS/网络限制，不是产品缺陷。"
                    "联网验收请在本机跑：python3 scripts/e2e.py")
              sys.exit(1)
          PY

      - name: 联网端到端
        env:
          KEEP_HOME: ${{ inputs.keep_home }}
          REQUIRE_CURRENCY: ${{ inputs.require_currency }}
        run: |
          set -euo pipefail
          args=()
          if [ "$KEEP_HOME" = "true" ]; then args+=(--keep); fi
          if [ "$REQUIRE_CURRENCY" = "true" ]; then args+=(--require-currency); fi
          echo "GUIJU_CURRENCY_URL=${GUIJU_CURRENCY_URL:-<未配置，将跳过编号定位断言>}"
          python scripts/e2e.py "${args[@]}"

      - name: 验收记录摘录
        if: always()
        run: head -40 docs/ACCEPTANCE.md
